<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASN Allrounder</title>

<!-- ===== PWA / "Zum Startbildschirm hinzufügen" ===== -->

<!-- Android / Chrome: liest das Manifest für Name, Icon und Standalone-Modus -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#21262B">

<!-- iOS / Safari: eigene Tags, da Safari das Manifest nur teilweise nutzt -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASN Allrounder">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">

<!-- Browser-Tab-Icon (Favicon) -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #EFEEE8; /* gleiche Hintergrundfarbe wie die App, damit es beim Laden nicht "blitzt" */
  }
  iframe {
    display: block;
    width: 100%;
    height: 100vh;
    height: 100dvh; /* korrekte volle Höhe auf Handys, auch mit Adressleiste */
    border: none;
  }
</style>
</head>
<body>
  <!--
    WICHTIG: Hier unten bei "src" deine eigene Apps-Script-Web-App-URL eintragen.
    Die findest du in Apps Script unter: Bereitstellen -> Bereitstellungen verwalten
    Es ist die URL, die auf /exec endet.
  -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbxtkZDRAniK_IRl2Pt7ovdR3mbJFIxlnmA1lLs1eZw2fQKC4hfVVKrCgcVGAxt2E9uu9g/exec"
    title="ASN Allrounder"
    allow="clipboard-write"
  ></iframe>
</body>
</html>
